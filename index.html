<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Study Timer</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>📚 Student Study Timer</h1>
        <p class="subtitle">Focus on your studies, one session at a time.</p>

        <div class="card">

            <label for="subject">What are you studying?</label>

            <input
                type="text"
                id="subject"
                placeholder="Example: Java, DBMS, AI..."
            >

            <div class="timer" id="timer">25:00</div>

            <div class="buttons">
                <button id="startBtn">▶ Start</button>
                <button id="pauseBtn">⏸ Pause</button>
                <button id="resetBtn">🔄 Reset</button>
            </div>

            <p id="message">Ready to start your study session!</p>

            <div class="session-box">
                <h3>Study Sessions Completed</h3>
                <span id="sessions">0</span>
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
